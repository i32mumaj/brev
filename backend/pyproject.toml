[project]
name = "brev"
version = "0.1.0"
description = "Acortador de URLs con contador de clics"
authors = [
    { name = "i32mumaj", email = "jorgemuniz2005@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.1.1",
]

[tool.fastapi]
entrypoint = "brev.main:app"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
