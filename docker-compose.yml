services:
  backend:
    image: i32mumaj/brev-backend:latest
    container_name: brev-backend
    ports:
      - "8000:8000"
    environment:
      - DB_DIR=/app/data
      - FRONTEND_ORIGIN=http://localhost:5173
    volumes:
      - brev_db:/app/data
    restart: unless-stopped

  frontend:
    image: i32mumaj/brev-frontend:latest
    container_name: brev-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  brev_db:
